name: Aether Build Check

# Fast compile/vet gate for the Aether integration branch. Lighter than ci.yml:
# it only builds and vets, so feedback comes back in a couple of minutes.
on:
  push:
    branches:
      - feat/aether-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Build all packages
        run: go build ./...
      - name: Vet aether package
        run: go vet ./internal/aether/...
      - name: Test aether and service packages
        run: go test -count=1 ./internal/aether/... ./internal/web/service/...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Generate OpenAPI/Zod
        working-directory: frontend
        run: npm run gen
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
